<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Where each SURGE Simple engine buys</title><desc id="d">Illustrative 1-minute chart. A stock runs to a $4.50 high of day, pulls back for two bars with a pullback high of $4.35, then breaks out. Simple 2 buys as price breaks $4.35 (about $4.36), Simple 3 buys when a candle closes above $4.35 (about $4.42), and Simple 1 buys when a candle closes above $4.50 (about $4.53).</desc><rect width="540" height="470" rx="16" fill="#0b2238"/><line x1="55" x2="527.4" y1="390.9" y2="390.9" stroke="#17344d"/><text x="47" y="395.9" text-anchor="end" font-size="16" fill="#9eb1c5">$4.00</text><line x1="55" x2="527.4" y1="332.7" y2="332.7" stroke="#17344d"/><text x="47" y="337.7" text-anchor="end" font-size="16" fill="#9eb1c5">$4.10</text><line x1="55" x2="527.4" y1="274.5" y2="274.5" stroke="#17344d"/><text x="47" y="279.5" text-anchor="end" font-size="16" fill="#9eb1c5">$4.20</text><line x1="55" x2="527.4" y1="216.3" y2="216.3" stroke="#17344d"/><text x="47" y="221.3" text-anchor="end" font-size="16" fill="#9eb1c5">$4.30</text><line x1="55" x2="527.4" y1="158.1" y2="158.1" stroke="#17344d"/><text x="47" y="163.1" text-anchor="end" font-size="16" fill="#9eb1c5">$4.40</text><line x1="55" x2="527.4" y1="99.9" y2="99.9" stroke="#17344d"/><text x="47" y="104.9" text-anchor="end" font-size="16" fill="#9eb1c5">$4.50</text><line x1="55" x2="527.4" y1="41.6" y2="41.6" stroke="#17344d"/><text x="47" y="46.6" text-anchor="end" font-size="16" fill="#9eb1c5">$4.60</text><rect x="277" y="30" width="105" height="390" fill="#fb923c" fill-opacity="0.14"/><text x="329.0" y="408" text-anchor="middle" font-size="17" font-weight="700" fill="#fb923c">PULLBACK</text><line x1="55" x2="527.4" y1="99.9" y2="99.9" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 6"/><text x="63" y="89.9" font-size="17" font-weight="700" fill="#