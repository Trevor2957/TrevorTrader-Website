<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Where each SURGE Simple engine buys</title><desc id="d">Illustrative 1-minute chart. A stock runs to a $4.50 high of day, pulls back for two bars with a pullback high of $4.35, then breaks out. Simple 2 buys as price breaks $4.35 (about $4.36), Simple 3 buys when a candle closes above $4.35 (about $4.42), and Simple 1 buys when a candle closes above $4.50 (about $4.53).</desc><rect width="1200" height="500" rx="16" fill="#0b2238"/><line x1="100" x2="1000" y1="410.1" y2="410.1" stroke="#17344d"/><text x="92" y="415.1" text-anchor="end" font-size="14" fill="#9eb1c5">$4.00</text><line x1="100" x2="1000" y1="350.4" y2="350.4" stroke="#17344d"/><text x="92" y="355.4" text-anchor="end" font-size="14" fill="#9eb1c5">$4.10</text><line x1="100" x2="1000" y1="290.7" y2="290.7" stroke="#17344d"/><text x="92" y="295.7" text-anchor="end" font-size="14" fill="#9eb1c5">$4.20</text><line x1="100" x2="1000" y1="231.0" y2="231.0" stroke="#17344d"/><text x="92" y="236.0" text-anchor="end" font-size="14" fill="#9eb1c5">$4.30</text><line x1="100" x2="1000" y1="171.3" y2="171.3" stroke="#17344d"/><text x="92" y="176.3" text-anchor="end" font-size="14" fill="#9eb1c5">$4.40</text><line x1="100" x2="1000" y1="111.6" y2="111.6" stroke="#17344d"/><text x="92" y="116.6" text-anchor="end" font-size="14" fill="#9eb1c5">$4.50</text><line x1="100" x2="1000" y1="51.9" y2="51.9" stroke="#17344d"/><text x="92" y="56.9" text-anchor="end" font-size="14" fill="#9eb1c5">$4.60</text><rect x="466" y="40" width="194" height="400" fill="#fb923c" fill-opacity="0.14"/><text x="563.0" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#fb923c">PULLBACK</text><line x1="100" x2="1000" y1="111.6" y2="111.6" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 6"/><text x="108" y="101.6" font-size="15" font-weight="700"